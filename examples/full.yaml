type: custom:alarmo-mushroom-card
entity: alarm_control_panel.alarmo
name: Home
language: auto
layout: default
fill_container: false
icon_type: icon

# Buttons
button_scale_actions: 1
show_ready_indicator: true
show_arm_options: true

# Keypad
use_code_dialog: false
hide_keypad: false
keep_keypad_visible: false
button_scale_keypad: 1

# Open sensors
show_messages: true
show_bypass_button: true
confirm_bypass: true
show_bypassed_sensors: true
max_sensor_chips: 6

states:
  armed_away:
    button_label: Away
    button_icon: mdi:lock
    button_order: 1
  armed_home:
    button_label: Home
    button_icon: mdi:home
    button_order: 2
  armed_night:
    hide: always
  armed_vacation:
    hide: always
  disarmed:
    button_label: Disarm
  # Reachable from the visual editor here; YAML-only upstream.
  triggered:
    state_label: Intruder
    color: red
  arming:
    color: orange
