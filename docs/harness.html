<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alarmo-mushroom-card — visual harness</title>
<!--
  Not shipped. Open this file directly (file://) to iterate on the card's CSS
  without a Home Assistant instance in the loop. It stubs the two Home
  Assistant elements the card uses and mounts one card per state with a
  hand-written fake hass.
-->
<style>
  :root{
    --primary-text-color:#212121;
    --secondary-text-color:#727272;
    --rgb-primary-text-color:33,33,33;
    --primary-color:#03a9f4;
    --card-background-color:#fff;
    --ha-card-background:#fff;
    --ha-card-border-radius:12px;
    --ha-card-border-width:1px;
    --ha-card-border-color:#e0e0e0;
    --ha-card-box-shadow:none;
    --rgb-red:244,67,54;--rgb-green:76,175,80;--rgb-blue:33,150,243;
    --rgb-orange:255,152,0;--rgb-grey:158,158,158;
    color-scheme:light;
  }
  body.dark{
    --primary-text-color:#e1e1e1;
    --secondary-text-color:#9b9b9b;
    --rgb-primary-text-color:225,225,225;
    --card-background-color:#1c1c1c;
    --ha-card-background:#1c1c1c;
    --ha-card-border-color:#2e2e2e;
    background:#111;
    color-scheme:dark;
  }
  body{
    margin:0;padding:24px;background:#f4f5f7;
    font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--primary-text-color);
  }
  body.square{--ha-card-border-radius:0px}
  h1{font-size:16px;font-weight:600;margin:0 0 4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .bar button{
    border:1px solid var(--ha-card-border-color);background:var(--ha-card-background);
    color:var(--primary-text-color);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .cell h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;
    color:var(--secondary-text-color);margin:0 0 8px}
  .narrow{max-width:250px}
</style>
</head>
<body>
<h1>alarmo-mushroom-card — visual harness</h1>
<div class="bar">
  <button onclick="document.body.classList.toggle('dark')">light / dark</button>
  <button onclick="document.body.classList.toggle('square')">square corners</button>
  <button onclick="toggleMushroomTheme()">Mushroom Square tokens</button>
</div>
<div class="grid" id="grid"></div>

<script>document.write('<script src="../dist/alarmo-mushroom-card.js?v=' + Date.now() + '"><\/script>');</script>

class HaIcon extends HTMLElement {
  static get observedAttributes(){ return ['icon']; }
  connectedCallback(){ this._render(); }
  attributeChangedCallback(){ this._render(); }
  _render(){
    const d = MDI[this.getAttribute('icon')] || MDI['mdi:alert-circle'];
    const size = getComputedStyle(this).getPropertyValue('--mdc-icon-size') || '24px';
    this.innerHTML =
      '<svg viewBox="0 0 24 24" style="width:' + size + ';height:' + size +
      ';display:block;fill:currentColor"><path d="' + d + '"></path></svg>';
  }
}
customElements.define('ha-icon', HaIcon);

class HaCard extends HTMLElement {
  connectedCallback(){
    this.style.display = this.style.display || 'block';
    this.style.background = 'var(--ha-card-background,var(--card-background-color,#fff))';
    this.style.borderRadius = 'var(--ha-card-border-radius,12px)';
    this.style.border = 'var(--ha-card-border-width,1px) solid var(--ha-card-border-color,#e0e0e0)';
    this.style.boxShadow = 'var(--ha-card-box-shadow,none)';
  }
}
customElements.define('ha-card', HaCard);

function toggleMushroomTheme(){
  const on = document.documentElement.style.getPropertyValue('--mush-control-border-radius');
  const set = (k,v) => document.documentElement.style.setProperty(k, on ? '' : v);
  set('--mush-control-border-radius','6px');
  set('--mush-icon-border-radius','6px');
  set('--mush-chip-border-radius','6px');
  set('--mush-spacing','8px');
}

/* ---- fake hass ---- */
const SENSORS = {
  'binary_sensor.front_door':   ['Front door', 'door', 'on'],
  'binary_sensor.back_door':    ['Back door', 'door', 'on'],
  'binary_sensor.living_window':['Living room window', 'window', 'on'],
  'binary_sensor.kitchen_window':['Kitchen window', 'window', 'on'],
  'binary_sensor.hall_motion':  ['Hallway motion', 'motion', 'on'],
  'binary_sensor.garage':       ['Garage door', 'garage_door', 'on'],
  'binary_sensor.office_window':['Office window', 'window', 'on'],
  'binary_sensor.shed':         ['Shed door', 'door', 'off']
};

function makeHass(state, attrs){
  const states = {
    'alarm_control_panel.alarmo': {
      entity_id: 'alarm_control_panel.alarmo',
      state: state,
      last_changed: new Date(Date.now() - 5000).toISOString(),
      attributes: Object.assign({
        friendly_name: 'Alarmo',
        supported_features: 1 | 2 | 4 | 32,
        code_arm_required: false
      }, attrs || {})
    }
  };
  for (const id of Object.keys(SENSORS)) {
    states[id] = {
      entity_id: id, state: SENSORS[id][2],
      attributes: { friendly_name: SENSORS[id][0], device_class: SENSORS[id][1] }
    };
  }
  return {
    states: states,
    language: 'en',
    locale: { language: 'en' },
    themes: { theme: 'default', darkMode: false },
    callWS: async (msg) => {
      if (msg.type === 'alarmo/entities') {
        return [{ area_id: 'home', entity_id: 'alarm_control_panel.alarmo' }];
      }
      if (msg.type === 'alarmo/config') {
        return { code_arm_required: true, code_disarm_required: true, code_format: 'number' };
      }
      if (msg.type === 'alarmo/countdown') return { delay: 30, remaining: 21 };
      if (msg.type === 'alarmo/ready_to_arm_modes') return { modes: ['armed_home', 'armed_night'] };
      if (msg.type === 'alarmo/sensors') {
        return Object.keys(SENSORS).reduce((all, id) => (all[id] = { entity_id: id }, all), {});
      }
      if (msg.type === 'alarmo/areas') {
        return { home: { modes: {
          armed_away: { exit_time: 60, entry_time: 120 },
          armed_home: { exit_time: 0, entry_time: 0 },
          armed_night: { exit_time: 0, entry_time: 0 },
          armed_vacation: { exit_time: 0, entry_time: 0 }
        } } };
      }
      throw new Error('unknown ' + msg.type);
    },
    callService: (d, s, p) => console.log('callService', d, s, p),
    connection: { subscribeMessage: async () => () => {} },
    localize: () => ''
  };
}

const openMap = (ids) => ids.reduce((all, id) => (all[id] = 'on', all), {});
const MANY = Object.keys(SENSORS).slice(0, 7);

const CASES = [
  ['Disarmed', 'disarmed', {}, {}],
  ['Arming (countdown)', 'arming', { arm_mode: 'armed_away', delay: 30 }, {}],
  ['Armed away', 'armed_away', {}, {}],
  ['Blocked by 2 sensors', 'disarmed',
    { open_sensors: openMap(['binary_sensor.front_door','binary_sensor.living_window']) },
    { failed: 'armed_away' }],
  ['Blocked — one now closed', 'disarmed',
    { open_sensors: openMap(['binary_sensor.shed','binary_sensor.living_window']) },
    { failed: 'armed_away' }],
  ['Blocked — all clear again', 'disarmed',
    { open_sensors: openMap(['binary_sensor.shed']) },
    { failed: 'armed_away' }],
  ['Blocked by 7 sensors', 'disarmed', { open_sensors: openMap(MANY) },
    { failed: 'armed_away' }],
  ['Triggered', 'triggered',
    { arm_mode: 'armed_away', open_sensors: openMap(['binary_sensor.back_door']) }, {}],
  ['Armed with bypassed', 'armed_away',
    { bypassed_sensors: ['binary_sensor.living_window','binary_sensor.garage'] }, {}],
  ['Disarm with keypad', 'armed_away', {}, { keypad: true }],
  ['Quiet (show_messages false)', 'disarmed',
    { open_sensors: openMap(['binary_sensor.front_door']) },
    { failed: 'armed_away', config: { show_messages: false } }],
  ['Horizontal layout', 'disarmed', {}, { config: { layout: 'horizontal' } }],
  ['Vertical layout', 'disarmed', {}, { config: { layout: 'vertical' } }],
  ['Narrow (250px)', 'disarmed', { open_sensors: openMap(['binary_sensor.front_door']) },
    { failed: 'armed_away', narrow: true }],
  ['Code sheet — disarm', 'armed_away', {}, { keypad: true, sheet: true }],
  ['Code sheet — arming away',
    'disarmed', { open_sensors: openMap(['binary_sensor.front_door','binary_sensor.living_window']) },
    { keypad: true, sheet: true, sheetMode: 'armed_away', sheetForce: true }]
];

const grid = document.getElementById('grid');
for (const [title, state, attrs, opts] of CASES) {
  const cell = document.createElement('div');
  cell.className = 'cell' + (opts.narrow ? ' narrow' : '');
  cell.innerHTML = '<h2>' + title + '</h2>';
  const card = document.createElement('alarmo-mushroom-card');
  card.setConfig(Object.assign({
    type: 'custom:alarmo-mushroom-card',
    entity: 'alarm_control_panel.alarmo'
  }, opts.config || {}));
  /* The backend handshake runs for real against the fake callWS above rather
     than being hand-stubbed: hand-set fields were being overwritten the moment
     the async bootstrap resolved, which hid a missing answer instead of
     showing it. */
  card._codeRequiredOverride = !!opts.keypad;
  card.hass = makeHass(state, attrs);
  cell.appendChild(card);
  /* One turn after the handshake resolves, put the card into the state this
     cell is demonstrating and draw it. */
  setTimeout(() => {
    if (opts.failed) card._pending = { mode: opts.failed, code: '', at: Date.now() };
    if (opts.sheet) {
      card._sheetOpen = true;
      card._sheetMode = opts.sheetMode || 'disarmed';
      card._code = '12';
      if (opts.sheetForce) card._armOptions = { force: true, skip_delay: false };
    }
    card._shellSig = null;
    card._render();
  }, 40);
  grid.appendChild(cell);
}
</script>
