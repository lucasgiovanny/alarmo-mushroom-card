<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>alarmo-mushroom-card — options matrix</title>
<!--
  Not shipped. Every card option is checked twice: that the visual editor
  round-trips it, and that setting it visibly changes what the card renders.
  An option that saves but does nothing is still a broken option.
-->
<style>
 body{font-family:ui-monospace,Menlo,monospace;font-size:12px;margin:0;padding:16px;background:#111;color:#ddd}
 .pass{color:#7bd88f}.fail{color:#ff6b6b}.head{color:#888;margin-top:12px}
 #host{position:absolute;left:-9999px;top:0;width:360px}
</style>
</head>
<body>
<pre id="report">running…</pre>
<div id="host"></div>
<script>document.write('<script src="../dist/alarmo-mushroom-card.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* ---- Home Assistant element stand-ins ---- */
class HaIcon extends HTMLElement {}
customElements.define('ha-icon', HaIcon);
class HaCard extends HTMLElement {}
customElements.define('ha-card', HaCard);

/* ha-form stand-in, semantics copied from ha-form.ts */
const getValue = (o, i) => o ? (!i.name || i.flatten ? o : o[i.name]) : undefined;
class HaFormStub extends HTMLElement {
  set schema(v){ this._schema = v; this._render(); }
  set data(v){ this._data = v; this._render(); }
  set hass(v){ this._hass = v; }
  _render(){
    if (!this._schema || !this._data) return;
    this.innerHTML = '';
    this.appendChild(this._build(this._schema, this._data, (p) => {
      this._data = Object.assign({}, this._data, p);
      this.dispatchEvent(new CustomEvent('value-changed',
        { detail: { value: this._data }, bubbles: true, composed: true }));
    }));
  }
  _build(schema, data, emit){
    const f = document.createDocumentFragment();
    for (const item of schema) {
      if (item.type === 'expandable' || item.type === 'grid') {
        f.appendChild(this._build(item.schema, getValue(data, item) || {},
          (p) => emit(!item.name || item.flatten ? p : { [item.name]: p })));
        continue;
      }
      const sel = item.selector || {};
      const el = document.createElement('input');
      el.id = 'f-' + item.name;
      el.dataset.kind = 'boolean' in sel ? 'boolean' : ('number' in sel ? 'number' : 'text');
      el.value = data[item.name] === undefined ? '' : data[item.name];
      el.checked = !!data[item.name];
      el.setValue = (v) => emit({ [item.name]: v });
      f.appendChild(el);
    }
    return f;
  }
}
customElements.define('ha-form', HaFormStub);

/* ---- fake hass ---- */
const SENSORS = {
  'binary_sensor.s1': ['Front door','door','on'], 'binary_sensor.s2': ['Back door','door','on'],
  'binary_sensor.s3': ['Window A','window','on'], 'binary_sensor.s4': ['Window B','window','on'],
  'binary_sensor.s5': ['Window C','window','on'], 'binary_sensor.s6': ['Motion','motion','on'],
  'binary_sensor.s7': ['Shed','door','on'],
  /* The one that is closed, so "everything shut again" can be reached. */
  'binary_sensor.s8': ['Garden door','door','off']
};
function hassFor(state, attrs, alarmo){
  const states = { 'alarm_control_panel.alarmo': {
    entity_id:'alarm_control_panel.alarmo', state, last_changed:new Date().toISOString(),
    attributes: Object.assign({ friendly_name:'Alarmo', supported_features: 1|2|4|32 }, attrs||{}) } };
  for (const id in SENSORS) states[id] = { entity_id:id, state:SENSORS[id][2],
    attributes:{ friendly_name:SENSORS[id][0], device_class:SENSORS[id][1] } };
  return { states, language:'en', locale:{language:'en'}, themes:{theme:'d',darkMode:false},
    callWS: async () => ({}), callService: (d,s,p)=>window.__calls.push([d,s,p]),
    connection:{subscribeMessage: async()=>()=>{}}, localize:()=>'' };
}
function card(config, state, attrs, alarmo, pending){
  const c = document.createElement('alarmo-mushroom-card');
  document.getElementById('host').appendChild(c);
  c.setConfig(Object.assign({ type:'custom:alarmo-mushroom-card',
    entity:'alarm_control_panel.alarmo' }, config));
  c._backendOk = true; c._areaId = 'home';
  c._alarmoConfig = Object.assign({ code_arm_required:false, code_disarm_required:false,
    code_format:'number' }, alarmo||{});
  /* The sensor config, the way alarmo/sensors answers it. Everything is armed
     in away and home, so opening one blocks arming. */
  c._sensors = (alarmo && alarmo.sensors !== undefined) ? alarmo.sensors
    : Object.keys(SENSORS).reduce((all, id) => (all[id] = {
        entity_id: id, enabled: true, area: 'home',
        modes: ['armed_away', 'armed_home', 'armed_night'] }, all), {});
  c._sensorCount = (alarmo && alarmo.sensorCount !== undefined)
    ? alarmo.sensorCount : Object.keys(c._sensors).length;
  c._readyModes = (alarmo && alarmo.ready !== undefined) ? alarmo.ready : ['armed_home'];
  if (pending) c._pending = { mode:pending, code:'', at:Date.now() };
  c.hass = hassFor(state, attrs);
  c._shellSig = null; c._render();
  return c;
}
const q = (c,s) => c.shadowRoot.querySelector(s);
const openN = (n) => Object.keys(SENSORS).slice(0,n).reduce((a,i)=>(a[i]='on',a),{});

/* ---- editor round-trip ---- */
function roundTrip(key, value){
  const ed = document.createElement('alarmo-mushroom-card-editor');
  document.getElementById('host').appendChild(ed);
  ed.setConfig({ type:'custom:alarmo-mushroom-card', entity:'alarm_control_panel.alarmo' });
  ed.hass = hassFor('disarmed', {});
  let emitted = null;
  /* The dashboard hands the emitted config straight back to the editor, and a
     setting that only appears behind another one depends on it doing so. */
  ed.addEventListener('config-changed', e => {
    emitted = e.detail.config;
    ed.setConfig(e.detail.config);
  });
  let f = ed.querySelector('#f-' + key);
  /* Several settings only appear behind the one they belong to — the keypad
     ones once the overlay is off, the tap-to-list one once the list is. Turn
     the governing switch and look again, rather than reporting a field that is
     merely contextual as missing. */
  for (const [governor, setting] of [['use_code_dialog', false], ['show_messages', false]]) {
    if (f) break;
    const switchNode = ed.querySelector('#f-' + governor);
    if (switchNode) { switchNode.setValue(setting); f = ed.querySelector('#f-' + key); }
  }
  if (!f) return 'no field in editor';
  emitted = null;   /* only the setting under test counts, not the one that revealed it */
  f.setValue(value);
  ed.remove();
  if (!emitted) return 'emitted nothing';
  const got = key.includes('__')
    ? (emitted.states || {})[key.split('__')[0]] &&
      (emitted.states || {})[key.split('__')[0]][key.split('__')[1]]
    : emitted[key];
  if (String(got) !== String(value)) return 'emitted ' + JSON.stringify(emitted);
  return true;
}

/* ---- the matrix ---- */
window.__calls = [];
const CASES = [
  ['name', 'Casa', c => q(card({name:'Casa'},'disarmed',{}),'#primary').textContent === 'Casa'],
  [null,'follows Home Assistant', () => {
      const c = document.createElement('alarmo-mushroom-card');
      document.getElementById('host').appendChild(c);
      c.setConfig({type:'custom:alarmo-mushroom-card',entity:'alarm_control_panel.alarmo'});
      c._backendOk=true; c._areaId='home'; c._sensorCount=7; c._readyModes=['armed_home'];
      c._alarmoConfig={code_arm_required:false,code_disarm_required:false,code_format:'number'};
      const h = hassFor('disarmed', {});
      h.language = 'pt-br'; h.locale = { language: 'pt-br' };
      c.hass = h; c._shellSig=null; c._render();
      return q(c,'#secondary').textContent === 'Desarmado'
        || 'the card must follow the Home Assistant language'; }],
  ['layout','horizontal', () => !!q(card({layout:'horizontal'},'disarmed',{}),'.hrow')],
  ['layout','vertical', () => !!q(card({layout:'vertical'},'disarmed',{}),'.state-item.vertical')],
  ['fill_container',true, () => !!q(card({fill_container:true},'disarmed',{}),'ha-card.fill')],
  ['icon_type','none', () => !q(card({icon_type:'none'},'disarmed',{}),'#hero-shape')],
  ['animations','full', () => { const c=card({animations:'full'},'disarmed',{});
      return c.getAttribute('data-anim')==='full' || 'the level must reach the DOM'; }],
  ['animations','none', () => { const c=card({animations:'none'},'triggered',
        {arm_mode:'armed_away',open_sensors:{'binary_sensor.s1':'on'}});
      return c.getAttribute('data-anim')==='none'; }],
  ['state_outline','both', () => { const c=card({state_outline:'both'},'armed_away',{},null,null);
      return q(c,'ha-card').hasAttribute('data-outline') || 'armed must be ringed'; }],
  [null,'the ring stays off unless asked for', () => {
      const c=card({},'armed_away',{});
      return !q(c,'ha-card').hasAttribute('data-outline') || 'the default is no ring'; }],
  [null,'triggered only rings when triggered', () => {
      const a=card({state_outline:'triggered'},'armed_away',{});
      const b=card({state_outline:'triggered'},'triggered',{arm_mode:'armed_away',
        open_sensors:{'binary_sensor.s1':'on'}});
      return (!q(a,'ha-card').hasAttribute('data-outline')
        && q(b,'ha-card').hasAttribute('data-outline')) || 'the ring followed the wrong state'; }],
  ['tap_action','none', () => { const c=card({tap_action:'none',use_code_dialog:true},'armed_away',{},{code_disarm_required:true});
      return !q(c,'.state-item.is-tappable') || 'the header still invites a tap that does nothing'; }],
  ['tap_action','more-info', () => { let fired=false;
      const c=card({tap_action:'more-info'},'disarmed',{});
      c.addEventListener('hass-more-info', () => { fired = true; });
      q(c,'.state-item').click();
      return fired || 'no hass-more-info event'; }],
  ['tap_action','code', () => { const c=card({tap_action:'code'},'armed_away',{},{code_disarm_required:true});
      q(c,'.state-item').click();
      return !!q(c,'.sheet') || 'the sheet did not open'; }],
  ['button_content','icon', () => !q(card({button_content:'icon'},'disarmed',{}),'#mode-armed_away .label')],
  ['button_content','name', () => { const b=q(card({button_content:'name'},'disarmed',{}),'#mode-armed_away');
      /* The readiness badge carries an ha-icon of its own, so only the
         button's direct children answer "is the mode icon drawn?" */
      return [...b.children].filter(n=>n.tagName==='HA-ICON').length===0; }],
  ['button_scale_actions',2, () => card({button_scale_actions:2},'disarmed',{}).style.getPropertyValue('--amc-scale-actions')==='2'],
  ['button_scale_keypad',2, () => card({button_scale_keypad:2},'disarmed',{}).style.getPropertyValue('--amc-scale-keypad')==='2'],
  ['hide_keypad',true, () => { const c=card({hide_keypad:true},'disarmed',{},{code_arm_required:true});
      return !q(c,'.keypad') && !!q(c,'.code'); }],
  ['keep_keypad_visible',true, () => !!q(card({keep_keypad_visible:true},'disarmed',{}),'.keypad')],
  ['use_code_dialog',true, () => { const c=card({use_code_dialog:true},'disarmed',{},{code_arm_required:true});
      if (q(c,'.code')) return 'inline code still drawn';
      q(c,'#mode-armed_away').click();
      return !!q(c,'.sheet') || 'sheet did not open'; }],
  ['show_messages',false, () => { const c=card({show_messages:false},'disarmed',{},null,'armed_away');
      return q(c,'.notice').hasAttribute('data-quiet'); }],
  ['show_bypass_button',false, () => !q(card({show_bypass_button:false},'disarmed',{},null,'armed_away'),'#bypass')],

  ['blocked_modes','hide', () => { const c=card({blocked_modes:'hide'},'disarmed',{});
      return !q(c,'#mode-armed_away') || 'a blocked mode must be off the row'; }],
  /* The default is never written to the config, so this half is the card only. */
  [null,'a blocked mode is drawn unavailable by default', () => { const c=card({},'disarmed',{});
      const b=q(c,'#mode-armed_away');
      return (b && b.getAttribute('aria-disabled')==='true')
        || 'a blocked mode must be drawn as unavailable'; }],
  [null,'the key puts the blocked modes back', () => {
      const c=card({blocked_modes:'hide'},'disarmed',{});
      if (q(c,'#mode-armed_away')) return 'the mode should start off the row';
      q(c,'#bypass').click();
      if (!q(c,'#mode-armed_away')) return 'turning the key must put it back';
      window.__calls=[];
      q(c,'#mode-armed_away').click();
      return (window.__calls.length===1 && window.__calls[0][2].force===true)
        || 'arming after the key must send force: ' + JSON.stringify(window.__calls); }],
  [null,'the key is offered without any attempt', () => {
      const c=card({},'disarmed',{});
      return (!!q(c,'#bypass') && !c._pending)
        || 'something is blocked, so the way past it must be on screen'; }],
  ['show_ready_indicator',false, () => q(card({show_ready_indicator:false},'disarmed',{},{ready:['armed_home']}),'#ready-armed_away').hasAttribute('hidden')],
  ['show_bypassed_sensors',false, () => !q(card({show_bypassed_sensors:false},'armed_away',{bypassed_sensors:['binary_sensor.s1']}),'.notice')],
  ['show_ready_notice',false, () => { const c=card({show_ready_notice:false},'disarmed',{},
        {sensors:{'binary_sensor.s8':{entity_id:'binary_sensor.s8',enabled:true,area:'home',
          modes:['armed_away']}}});
      /* s8 is the closed one, so nothing is in the way and the all-clear panel
         is exactly what this hides. Nothing is locked either, so there is
         correctly no key to offer. */
      return (!q(c,'.notice') && !q(c,'#bypass'))
        || 'the all-clear panel must go, and with nothing locked there is no key'; }],
  /* A default value is never written to the config, so this half is the card
     only — the false case above covers the editor round-trip. */
  [null,'all-clear panel shown by default', () => { const c=card({},'disarmed',{},
        {sensors:{'binary_sensor.s8':{entity_id:'binary_sensor.s8',enabled:true,area:'home',
          modes:['armed_away']}}},'armed_away');
      return q(c,'.notice') && q(c,'.notice').dataset.kind === 'ready'
        || 'the all-clear panel should be shown by default'; }],
  [null,'an open sensor is reported before any attempt', () => { const c=card({},'disarmed',{});
      /* No failed arm, no open_sensors attribute — just a door standing open. */
      const n = q(c,'.notice');
      return (n && n.dataset.kind === 'blocked' && !c._pending)
        || 'a door standing open must be reported without waiting for a failure'; }],
  [null,'nothing registered in Alarmo reports nothing', () => { const c=card({},'disarmed',{},
        {sensors:{}, sensorCount:0});
      return !q(c,'.notice') || 'an empty sensor list has nothing to say'; }],
  ['show_skip_delay_option',false, () => { const c=card({show_skip_delay_option:false},'disarmed',{});
      /* The key shares this row, and something is blocked here, so the row
         itself stays — only the delay chip goes. */
      return (!q(c,'#opt-skip') && !!q(c,'#bypass'))
        || 'only the delay chip should go'; }],
  [null,'an empty shortcut row is not drawn', () => {
      const c=card({show_skip_delay_option:false,show_bypass_button:false},'disarmed',{});
      return !q(c,'.arm-options') || 'a row with nothing in it should not exist'; }],
  ['show_sensor_count',false, () => { const c=card({show_sensor_count:false},'disarmed',{});
      const n=q(c,'#notice-count');
      return (n && n.hasAttribute('hidden')) || 'the count must be hideable'; }],
  ['show_sensors_on_tap',false, () => { const c=card({show_messages:false,show_sensors_on_tap:false},'disarmed',{});
      const n=q(c,'.notice');
      return (n && !n.hasAttribute('data-tap')) || 'the panel must be inert when this is off'; }],
  [null,'the quiet panel opens the list on a tap', () => {
      const c=card({show_messages:false},'disarmed',{});
      const head=q(c,'.notice-head');
      if (head.tagName !== 'BUTTON') return 'the tappable headline has to be a button';
      head.click();
      const rows=c.shadowRoot.querySelectorAll('.sensor-list .chip').length;
      return (rows===7 && c.shadowRoot.activeElement === q(c,'.sheet-close'))
        || 'expected every open sensor in the overlay, with focus on the way out, got ' + rows; }],
  [null,'the overlay closes and hands focus back', () => {
      const c=card({show_messages:false},'disarmed',{});
      q(c,'.notice-head').click();
      q(c,'.sheet-close').click();
      return (!q(c,'.sheet-sensors') && c.shadowRoot.activeElement === q(c,'.notice-head'))
        || 'closing must put focus back where the tap came from'; }],
  [null,'nothing hides behind a tap while the list is on', () => {
      const c=card({},'disarmed',{});
      return !q(c,'.notice').hasAttribute('data-tap')
        || 'the sensors are already on the card, so there is nothing to open'; }],
  [null,'every open sensor gets a chip, and the row scrolls', () => {
      const c=card({},'disarmed',{});
      const chips=c.shadowRoot.querySelectorAll('.chip').length;
      const row=q(c,'.notice-chips');
      return (chips===7 && !!row) || 'expected one chip per open sensor, got ' + chips; }],
  ['armed_away__button_label','Fora', () => q(card({states:{armed_away:{button_label:'Fora'}}},'disarmed',{}),'#mode-armed_away .label').textContent==='Fora'],
  ['armed_away__button_icon','mdi:car', () => q(card({states:{armed_away:{button_icon:'mdi:car'}}},'disarmed',{}),'#mode-armed_away ha-icon').getAttribute('icon')==='mdi:car'],
  ['armed_home__hide','always', () => !q(card({states:{armed_home:{hide:'always'}}},'disarmed',{}),'#mode-armed_home')],
  ['disarmed__color','red', () => card({states:{disarmed:{color:'red'}}},'disarmed',{}).style.getPropertyValue('--amc-state-rgb').includes('red')],
  ['triggered__state_label','Intruso', () => q(card({states:{triggered:{state_label:'Intruso'}}},'triggered',{}),'#secondary').textContent==='Intruso'],
  ['armed_away__button_order',9, () => { const c=card({states:{armed_away:{button_order:9}}},'disarmed',{});
      const ids=[...c.shadowRoot.querySelectorAll('.button-group .control')].map(b=>b.id);
      return ids[ids.length-1]==='mode-armed_away' || ids.join(','); }]
];

const lines = [];
let pass = 0, fail = 0;
lines.push('OPTION'.padEnd(28) + 'EDITOR'.padEnd(10) + 'CARD EFFECT');
for (const [key, value, effect] of CASES) {
  /* A null key means the behaviour has no editor field of its own. */
  let ed = key === null ? true : undefined;
  if (key !== null) {
    try { ed = roundTrip(key, value); } catch (e) { ed = 'threw: ' + e.message; }
  }
  let fx;
  try { fx = effect(); } catch (e) { fx = 'threw: ' + e.message; }
  const edOk = ed === true, fxOk = fx === true;
  if (edOk && fxOk) pass++; else fail++;
  lines.push(
    ((key === null ? 'language' : key) + '=' + JSON.stringify(value)).padEnd(28) +
    (edOk ? (key === null ? '—' : 'ok') : 'FAIL').padEnd(10) +
    (fxOk ? 'ok' : 'FAIL') +
    (edOk ? '' : '\n    editor: ' + ed) +
    (fxOk ? '' : '\n    card:   ' + fx));
}
lines.push('');
lines.push(pass + ' passed, ' + fail + ' failed');
window.__report = { pass, fail, text: lines.join('\n') };
document.getElementById('report').textContent = lines.join('\n');
</script>
</body>
</html>
